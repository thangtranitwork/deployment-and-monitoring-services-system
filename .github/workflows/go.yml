name: CI Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js (Frontend)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Build React SPA Frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Set up Go (Backend)
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.x'
        check-latest: true

    - name: Build Go Backend
      run: go build -v ./...

    - name: Run Go Tests
      run: go test -v ./...
